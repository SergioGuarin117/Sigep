services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: sigep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sigep_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en backend/.env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Los .sql de esta carpeta se ejecutan en orden alfabetico al crear la BD
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sigep_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de IA (FastAPI): sugiere el nivel de triage y explica por que. El modelo se entrena al construir la imagen.
  ai-service:
    build: ./ai-service
    container_name: sigep-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build: ./backend
    container_name: sigep-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # Si la IA no responde, el triage sigue funcionando solo con las reglas.
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  postgres_data: