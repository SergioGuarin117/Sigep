services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: sigep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sigep_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: juegos11
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Los .sql de esta carpeta se ejecutan en orden alfabetico al crear la BD
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sigep_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sigep-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: